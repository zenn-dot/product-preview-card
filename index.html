<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-[hsl(30,38%,92%)] flex justify-center items-center min-h-screen m-0">

  <div class="flex bg-white max-w-xl rounded-xl overflow-hidden">

    <div class="w-1/2">
      <img src="images/image-product-desktop.jpg" alt="Perfume"
           class="w-full h-full object-cover">
    </div>

    <div class="w-1/2 p-8 flex flex-col justify-between">

      <div>
        <span class="text-xs tracking-[4px] text-gray-500 block mb-4">
          PERFUME
        </span>

        <h1 class="text-2xl font-bold mb-4">
          Gabrielle Essence Eau De Parfum
        </h1>

        <p class="text-sm text-gray-500 mb-6">
          A floral, solar and voluptuous interpretation composed by Olivier Polge, 
          Perfumer-Creator for the House of CHANEL.
        </p>
      </div>

      <div>
        <div class="flex items-center gap-5 mb-6">
          <h2 class="text-green-700 text-2xl font-bold">
            $149.99
          </h2>

          <span class="text-gray-400 line-through text-sm">
            $169.99
          </span>
        </div>

        <button class="bg-green-900 text-white w-full py-3 rounded-lg hover:bg-green-800 transition">
          Add to Cart
        </button>
      </div>

    </div>

  </div>

</body>
</html>
